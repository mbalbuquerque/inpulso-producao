<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Excluir Cliente | Inpulso</title>

</head>

<body>

<div style="max-width:600px;margin:80px auto;font-family:Arial;">

    <h1>Excluir cliente</h1>

    <p>
        Tem certeza que deseja excluir o cliente:
    </p>

    <h2>{{ cliente.nome }}</h2>

    <form method="post">

        {% csrf_token %}

        <button
            type="submit"
            style="
                padding:10px 20px;
                background:#dc2626;
                color:white;
                border:none;
                border-radius:5px;
                cursor:pointer;
            "
        >
            Sim, excluir
        </button>

        <a
            href="{% url 'clientes:lista' %}"
            style="margin-left:10px;"
        >
            Cancelar
        </a>

    </form>

</div>

</body>

</html>
